[package]
name = "tahan-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Tahan Journal desktop shell (Tauri 2)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
aria-contracts = { path = "../../crates/aria-contracts" }
aria-storage-engine = { path = "../../crates/aria-storage-engine" }
aria-domain-engine = { path = "../../crates/aria-domain-engine" }
aria-schema-engine = { path = "../../crates/aria-schema-engine" }
aria-query-engine = { path = "../../crates/aria-query-engine" }
aria-ui-engine = { path = "../../crates/aria-ui-engine" }
aria-plugin-engine = { path = "../../crates/aria-plugin-engine" }
aria-import-engine = { path = "../../crates/aria-import-engine" }
aria-backup-engine = { path = "../../crates/aria-backup-engine" }
rusqlite = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
base64 = "0.22"

[dev-dependencies]
image = { workspace = true }

[features]
default = []
